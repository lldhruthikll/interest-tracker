version: '3.8'

services:
  postgres:
    image: postgres:18-alpine
    container_name: interest_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: interest_collection_db
    ports:
      - "5436:5432"
    volumes:
      # PG18 images keep PGDATA at /var/lib/postgresql/18/docker; mount the parent.
      - postgres18_data:/var/lib/postgresql

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: interest_backend
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      DATABASE_URL: "postgresql://postgres:postgrespassword@postgres:5432/interest_collection_db?schema=public"
      JWT_SECRET: "${JWT_SECRET:?set JWT_SECRET in your shell or a repo-root .env}"
      CORS_ORIGIN: "http://localhost:3000"
    depends_on:
      - postgres
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: interest_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: always

volumes:
  postgres_data:
  postgres18_data:
